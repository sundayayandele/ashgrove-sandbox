[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ashgrove-sandbox"
version = "0.1.0"
description = "Ashgrove Group: a fictional company with seeded systems for AI agent and agentic AI capstones"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sunday Ayandele" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pyjwt[crypto]>=2.8,<3",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.11"]

[project.scripts]
ashgrove = "ashgrove.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ashgrove"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
